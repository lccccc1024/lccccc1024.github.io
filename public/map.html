<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: 'd8fa834b0ec75037053251b01d958f01',
    }
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=be9dd191700058ef7da897f2763e4782"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var places = [];
      try { places = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch(e) {}

      if (typeof AMap === 'undefined') { document.getElementById('map').textContent = '地图暂不可用，请稍后重试'; return; }
      var map = new AMap.Map('map', {
        zoom: 4,
        center: [104.1954, 35.8617],
        viewMode: '2D'
      });

      var isDark = false;
      try { isDark = parent.document.documentElement.classList.contains('dark'); } catch(e) {}
      if (isDark) map.setMapStyle('amap://styles/dark');

      if (!Array.isArray(places)) places = [];
      places = places.filter(function(p) {
        return p && typeof p.name === 'string' && typeof p.date === 'string' &&
          (p.note == null || typeof p.note === 'string') &&
          Number.isFinite(p.lng) && Math.abs(p.lng) <= 180 &&
          Number.isFinite(p.lat) && Math.abs(p.lat) <= 90;
      }).slice(0, 1000);
      places.forEach(function(p) {
        var content = document.createElement('div');
        var name = document.createElement('b');
        name.textContent = p.name;
        content.append(name, document.createElement('br'), document.createTextNode(p.date === '0000-00-00' ? '—' : p.date));
        if (p.note) content.append(document.createElement('br'), document.createTextNode(p.note));
        var m = new AMap.Marker({ position: [p.lng, p.lat], title: p.name, animation: 'AMAP_ANIMATION_DROP' });
        var iw = new AMap.InfoWindow({
          content: content,
          offset: new AMap.Pixel(0, -20)
        });
        m.on('click', function() { iw.open(map, m.getPosition()); });
        map.add(m);
      });

      if (places.length > 0) map.setFitView(null, false, [60, 60, 60, 60]);

      // Listen for theme changes from parent
      try {
        new MutationObserver(function() {
          var d = parent.document.documentElement.classList.contains('dark');
          map.setMapStyle(d ? 'amap://styles/dark' : 'amap://styles/normal');
        }).observe(parent.document.documentElement, { attributes: true, attributeFilter: ['class'] });
      } catch(e) {}
    });
  </script>
</body>
</html>
