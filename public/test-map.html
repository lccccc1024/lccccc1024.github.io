<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高德地图测试</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { width: 100%; height: 600px; }
  </style>
</head>
<body>
  <h2 style="padding:10px">高德地图测试页</h2>
  <div id="map"></div>

  <script>
    window._AMapSecurityConfig = {
      securityJsCode: 'd8fa834b0ec75037053251b01d958f01',
    }
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=be9dd191700058ef7da897f2763e4782"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var log = document.createElement('pre');
      log.id = 'log';
      log.style.cssText = 'padding:10px;background:#f5f5f5;margin:10px;white-space:pre-wrap';
      document.body.appendChild(log);

      function out(msg) { log.textContent += msg + '\n'; }

      out('AMap defined: ' + (typeof AMap));

      if (typeof AMap === 'undefined') {
        out('ERROR: AMap not loaded!');
        return;
      }

      try {
        var map = new AMap.Map('map', {
          zoom: 4,
          center: [104.1954, 35.8617]
        });
        out('Map created OK');

        var marker = new AMap.Marker({
          position: [116.4074, 39.9042],
          title: '北京'
        });
        map.add(marker);
        out('Marker added');

        out('Map zoom: ' + map.getZoom());
        out('Map center: ' + map.getCenter());
      } catch(e) {
        out('ERROR: ' + e.message);
      }
    });
  </script>
</body>
</html>
